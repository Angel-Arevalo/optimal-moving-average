[project]
name = "prueba-cadena-markov"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "hmmlearn==0.3.3", "scikit-optimize==0.10.2",
  "ta-lib>=0.6,<0.9", "pyarrow>=18", "qnt", "h5netcdf>=1.4",
  "pytest>=8,<10", "threadpoolctl>=3",
]

[tool.uv.sources]
qnt = { git = "https://github.com/quantiacs/toolbox.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

